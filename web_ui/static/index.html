<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TIA Portal 控制台</title>
<style>
  :root { --bg:#0f1419; --panel:#1a2029; --line:#2c3542; --fg:#dce3ea; --dim:#7d8a99; --accent:#3b82f6; --ok:#22c55e; --err:#ef4444; --warn:#f59e0b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif; padding:16px; }
  h1 { font-size:18px; margin-bottom:12px; }
  h2 { font-size:14px; margin:14px 0 8px; color:var(--accent); border-bottom:1px solid var(--line); padding-bottom:4px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:12px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .status { display:inline-block; padding:2px 10px; border-radius:10px; font-size:12px; margin-left:8px; }
  .st-ok { background:#13291a; color:var(--ok); } .st-off { background:#2a1a1a; color:var(--err); }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
  input,select,textarea { background:#12181f; border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:6px 10px; font:inherit; }
  input:focus,select:focus,textarea:focus { outline:1px solid var(--accent); }
  input { width:130px; } input.wide { width:220px; } textarea { width:100%; height:120px; font-family:Consolas,monospace; font-size:12px; }
  button { background:#1f2a3a; border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:6px 14px; cursor:pointer; }
  button:hover { background:#2a3a52; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.ok { background:#143824; border-color:var(--ok); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { border:1px solid var(--line); padding:4px 8px; text-align:left; }
  th { background:#141b24; color:var(--dim); font-weight:normal; }
  .err { color:var(--err); } .okc { color:var(--ok); } .warn { color:var(--warn); }
  #log { background:#0b0f14; border:1px solid var(--line); border-radius:6px; height:150px; overflow-y:auto; font:12px/1.5 Consolas,monospace; padding:8px; color:var(--dim); }
  .btn-mini { padding:2px 8px; font-size:12px; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  #result { background:#12181f; border:1px solid var(--line); border-radius:6px; padding:8px; font:12px Consolas,monospace; max-height:220px; overflow:auto; white-space:pre-wrap; }
</style>
</head>
<body>
<h1>⚙ TIA Portal 控制台 <span id="statusBar" class="status st-off">未连接</span></h1>

<div class="grid">
  <!-- 工程 -->
  <div class="panel">
    <h2>工程</h2>
    <div class="row">
      <input id="projName" placeholder="工程名(留空自动)" class="wide">
      <button class="primary" onclick="cmd('create-project',{projectName:val('projName'),outDir:OUT_DIR})">新建工程</button>
    </div>
    <div class="row">
      <input id="projFile" placeholder=".ap21 绝对路径" class="wide">
      <button onclick="cmd('open-project',{projectFile:val('projFile')})">打开</button>
      <button onclick="cmd('list-projects',{})">列出</button>
    </div>
    <div class="row">
      <button onclick="cmd('add-cpu',{})">+ CPU 1511</button>
      <button onclick="cmd('add-hmi',{})">+ HMI KTP700</button>
      <button onclick="cmd('save-project',{})">保存</button>
      <button onclick="cmd('read-project',{outDir:OUT_DIR+'/export'})">读取工程</button>
      <button onclick="cmd('report',{outDir:OUT_DIR+'/reports'})">生成报告</button>
    </div>
  </div>

  <!-- 变量表 -->
  <div class="panel">
    <h2>变量表</h2>
    <div class="row">
      <input id="tagTable" value="TagTable_1" placeholder="表名">
      <button class="primary" onclick="addTags()">添加标签</button>
      <button onclick="cmd('list-tag-tables',{})">列出</button>
    </div>
    <div id="tagRows"></div>
    <div class="row"><button class="btn-mini" onclick="addTagRow()">+ 一行</button></div>
  </div>

  <!-- 程序生成 -->
  <div class="panel">
    <h2>程序生成(模板)</h2>
    <div class="row">
      <select id="tplSel">
        <option value="traffic-light">交通灯(绿/黄/红)</option>
        <option value="motor-rev">电机正反转互锁</option>
        <option value="counter">计数分拣</option>
      </select>
      <input id="tplParams" placeholder='如 {"GREEN_TIME":"5s","RED_TIME":"8s"}' class="wide">
      <button class="primary" onclick="genTemplate()">生成并导入</button>
    </div>
    <h2>LAD 配方</h2>
    <div class="row">
      <select id="ladRecipe">
        <option value="self_lock">自锁(启/停/输出)</option>
        <option value="blink">闪烁(使能/输出/周期)</option>
        <option value="contact_coil">单触点输出</option>
        <option value="set">置位</option>
        <option value="reset">复位</option>
        <option value="compare">比较</option>
        <option value="arith">算术</option>
      </select>
      <button onclick="genLad()">生成 LAD 块</button>
    </div>
    <h2>SCL 源码(中文注释可用)</h2>
    <textarea id="sclCode" placeholder="粘贴 SCL 代码…"></textarea>
    <div class="row"><button class="primary" onclick="importScl()">导入 SCL</button></div>
  </div>

  <!-- 编译与读取 -->
  <div class="panel">
    <h2>编译与诊断</h2>
    <div class="row"><button class="ok" onclick="cmd('compile',{})">编译</button></div>
    <div id="result">结果区</div>
  </div>
</div>

<div class="panel" style="margin-top:12px">
  <h2>日志</h2>
  <div id="log"></div>
</div>

<script>
let OUT_DIR = '';  // 由后端 /api/status 提供
let TAG_SEQ = 0;

function val(id) { return document.getElementById(id).value.trim(); }
function setVal(id, v) { document.getElementById(id).value = v; }

async function cmd(cmdName, args) {
  const el = document.getElementById('result');
  el.innerHTML = '<span class="warn">执行中…</span>';
  try {
    const r = await fetch('/api/cmd', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({cmd:cmdName, args:args||{}})
    });
    const data = await r.json();
    if (data.ok) {
      el.innerHTML = '<span class="okc">✓ ' + cmdName + '</span>\n' + JSON.stringify(data.result, null, 2);
      refreshStatus();
    } else {
      el.innerHTML = '<span class="err">✗ ' + cmdName + '</span>\n' + (data.error||'');
    }
  } catch(e) {
    el.innerHTML = '<span class="err">请求失败: ' + e + '</span>';
  }
}

function addTagRow(name, dt, addr) {
  TAG_SEQ++;
  const div = document.createElement('div');
  div.className = 'row';
  div.innerHTML =
    '<input placeholder="名称" value="'+(name||'')+'" data-f="name">' +
    '<select data-f="dataType"><option>Bool</option><option>Int</option><option>Real</option><option>Word</option><option>DInt</option></select>' +
    '<input placeholder="地址 如 I0.0" value="'+(addr||'')+'" data-f="address" style="width:100px">' +
    '<button class="btn-mini" onclick="this.parentNode.remove()">✕</button>';
  if (dt) div.querySelector('[data-f="dataType"]').value = dt;
  document.getElementById('tagRows').appendChild(div);
}
addTagRow('Start_Btn','Bool','I0.0'); addTagRow('Stop_Btn','Bool','I0.1'); addTagRow('Motor_On','Bool','Q0.0');

async function addTags() {
  const tags = [...document.querySelectorAll('#tagRows .row')].map(r => ({
    name: r.querySelector('[data-f="name"]').value,
    dataType: r.querySelector('[data-f="dataType"]').value,
    address: r.querySelector('[data-f="address"]').value,
  })).filter(t => t.name);
  await cmd('add-tags', {table: val('tagTable'), tags});
}

async function genTemplate() {
  let params = {};
  try { params = JSON.parse(val('tplParams') || '{}'); } catch(e) {}
  await cmd('gen-template', {template: val('tplSel'), params});
}

async function genLad() {
  // 简化:自锁/闪烁走完整 spec,其余用配方网络
  const recipe = val('ladRecipe');
  let spec;
  if (recipe === 'self_lock') {
    spec = {type:'FB', name:'FB_SelfLock', number:21001, comment:'启停自锁', interface:{input:[{name:'bStart',datatype:'Bool'},{name:'bStop',datatype:'Bool'}],output:[{name:'qOut',datatype:'Bool'}]}, networks:[{title:'N1 自锁',recipe:'self_lock',args:{start:'bStart',stop:'bStop',output:'qOut'}}]};
  } else if (recipe === 'blink') {
    spec = {type:'FB', name:'FB_Blink', number:21002, comment:'LED 闪烁', interface:{input:[{name:'bEnable',datatype:'Bool'}],output:[{name:'bLed',datatype:'Bool'}],static:[{name:'tonB',datatype:'TON_TIME'}]}, networks:[{title:'N1 闪烁',recipe:'blink',args:{enable:'bEnable',output:'bLed',ton:'tonB',period:'T#500ms'}}]};
  } else {
    alert('该配方请用 gen-lad spec(见文档),或选自锁/闪烁');
    return;
  }
  await cmd('gen-lad', {spec, outDir: OUT_DIR + '/lad'});
}

async function importScl() {
  const code = document.getElementById('sclCode').value;
  if (!code.trim()) return alert('请粘贴 SCL 代码');
  const name = (code.match(/FUNCTION_BLOCK\s+"([^"]+)"/) || [,'SCL_Import'])[1];
  const resp = await fetch('/api/save-scl', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name, code})});
  if (!resp.ok) return alert('保存源码失败');
  await cmd('import-scl', {sclFile: OUT_DIR + '/scl/' + name + '.scl'});
}

async function refreshStatus() {
  try {
    const r = await fetch('/api/status'); const s = await r.json();
    if (s.outDir) OUT_DIR = s.outDir;
    const bar = document.getElementById('statusBar');
    bar.textContent = s.ready ? (s.attach ? 'Attach: ' + (s.project||'工程') : 'Headless') : '未连接';
    bar.className = 'status ' + (s.ready ? 'st-ok' : 'st-off');
  } catch(e) {}
}

async function pollLog() {
  try {
    const r = await fetch('/api/log'); const d = await r.json();
    const el = document.getElementById('log');
    if (d.lines && d.lines.length) el.innerHTML = d.lines.map(l => escapeHtml(l)).join('<br>');
    el.scrollTop = el.scrollHeight;
  } catch(e) {}
  setTimeout(pollLog, 2000);
}
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

refreshStatus();
setTimeout(pollLog, 500);
</script>
</body>
</html>
