<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TIA Portal 控制台</title>
<style>
  :root { --fg:#e6ecf4; --dim:#94a3b8; --accent:#60a5fa; --ok:#34d399; --err:#f87171; --warn:#fbbf24; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    color:var(--fg); font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif; padding:18px;
    background:
      radial-gradient(700px 480px at 12% 8%,  rgba(59,130,246,.28), transparent 60%),
      radial-gradient(800px 520px at 88% 18%, rgba(139,92,246,.24), transparent 60%),
      radial-gradient(700px 520px at 50% 95%, rgba(34,211,238,.16), transparent 60%),
      #0a0e16;
    min-height:100vh;
  }
  h1 { font-size:18px; margin-bottom:14px; letter-spacing:.5px; }
  h2 { font-size:13px; margin:12px 0 8px; color:var(--accent); border-bottom:1px solid rgba(255,255,255,.09); padding-bottom:5px; letter-spacing:.5px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:14px; }
  .panel {
    background:rgba(255,255,255,.055);
    backdrop-filter:blur(20px) saturate(150%);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    border:1px solid rgba(255,255,255,.11);
    border-radius:16px;
    padding:14px;
    box-shadow:0 10px 36px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .status { display:inline-block; padding:3px 12px; border-radius:12px; font-size:12px; margin-left:8px; backdrop-filter:blur(8px); }
  .st-ok { background:rgba(52,211,153,.14); color:var(--ok); border:1px solid rgba(52,211,153,.25); }
  .st-off { background:rgba(248,113,113,.14); color:var(--err); border:1px solid rgba(248,113,113,.25); }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
  input,select,textarea {
    background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.13); color:var(--fg);
    border-radius:10px; padding:7px 11px; font:inherit;
    backdrop-filter:blur(6px);
  }
  input:focus,select:focus,textarea:focus { outline:1px solid var(--accent); border-color:var(--accent); }
  input { width:130px; } input.wide { width:220px; }
  textarea { width:100%; height:120px; font-family:Consolas,monospace; font-size:12px; }
  button {
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); color:var(--fg);
    border-radius:10px; padding:7px 15px; cursor:pointer; transition:all .15s;
    backdrop-filter:blur(6px);
  }
  button:hover { background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.28); transform:translateY(-1px); }
  button.primary { background:linear-gradient(135deg, rgba(59,130,246,.85), rgba(99,102,241,.85)); border-color:rgba(147,197,253,.35); color:#fff; box-shadow:0 4px 16px rgba(59,130,246,.3); }
  button.primary:hover { filter:brightness(1.15); }
  button.ok { background:rgba(52,211,153,.16); border-color:rgba(52,211,153,.35); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { border:1px solid rgba(255,255,255,.09); padding:4px 8px; text-align:left; }
  th { background:rgba(255,255,255,.05); color:var(--dim); font-weight:normal; }
  .err { color:var(--err); } .okc { color:var(--ok); } .warn { color:var(--warn); }
  #log {
    background:rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.1); border-radius:12px;
    height:150px; overflow-y:auto; font:12px/1.5 Consolas,monospace; padding:10px; color:var(--dim);
    backdrop-filter:blur(8px);
  }
  .btn-mini { padding:3px 9px; font-size:12px; }
  #result {
    background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.1); border-radius:12px;
    padding:10px; font:12px Consolas,monospace; max-height:220px; overflow:auto; white-space:pre-wrap;
    backdrop-filter:blur(8px);
  }
</style>
</head>
<body>
<h1>⚙ TIA Portal 控制台 <span id="statusBar" class="status st-off">未连接</span></h1>

<div class="grid">
  <!-- 工程 -->
  <div class="panel">
    <h2>工程</h2>
    <div class="row">
      <input type="file" id="projFilePicker" accept=".ap21" style="display:none">
      <button class="primary" onclick="document.getElementById('projFilePicker').click()">连接工程…</button>
      <button onclick="cmd('close-project',{})">断开工程</button>
      <button onclick="cmd('read-project',{outDir:OUT_DIR+'/export'})">读取工程</button>
      <button onclick="cmd('save-project',{})">保存</button>
    </div>
  </div>

  <!-- 变量表 -->
  <div class="panel">
    <h2>变量表</h2>
    <div class="row">
      <input id="tagTable" value="TagTable_1" placeholder="表名">
      <button class="primary" onclick="addTags()">添加标签</button>
      <button onclick="cmd('list-tag-tables',{})">列出</button>
    </div>
    <div id="tagRows"></div>
    <div class="row"><button class="btn-mini" onclick="addTagRow()">+ 一行</button></div>
  </div>

  <!-- 编译与读取 -->
  <div class="panel">
    <h2>编译与诊断</h2>
    <div class="row"><button class="ok" onclick="cmd('compile',{})">编译</button></div>
    <div id="result">结果区</div>
  </div>
</div>

<div class="panel" style="margin-top:12px">
  <h2>日志</h2>
  <div id="log"></div>
</div>

<script>
let OUT_DIR = '';  // 由后端 /api/status 提供
let TAG_SEQ = 0;

function val(id) { return document.getElementById(id).value.trim(); }
function setVal(id, v) { document.getElementById(id).value = v; }

async function cmd(cmdName, args) {
  const el = document.getElementById('result');
  el.innerHTML = '<span class="warn">执行中…</span>';
  try {
    const r = await fetch('/api/cmd', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({cmd:cmdName, args:args||{}})
    });
    const data = await r.json();
    if (data.ok) {
      el.innerHTML = '<span class="okc">✓ ' + cmdName + '</span>\n' + JSON.stringify(data.result, null, 2);
      refreshStatus();
    } else {
      el.innerHTML = '<span class="err">✗ ' + cmdName + '</span>\n' + (data.error||'');
    }
  } catch(e) {
    el.innerHTML = '<span class="err">请求失败: ' + e + '</span>';
  }
}

function addTagRow(name, dt, addr) {
  TAG_SEQ++;
  const div = document.createElement('div');
  div.className = 'row';
  div.innerHTML =
    '<input placeholder="名称" value="'+(name||'')+'" data-f="name">' +
    '<select data-f="dataType"><option>Bool</option><option>Int</option><option>Real</option><option>Word</option><option>DInt</option></select>' +
    '<input placeholder="地址 如 I0.0" value="'+(addr||'')+'" data-f="address" style="width:100px">' +
    '<button class="btn-mini" onclick="this.parentNode.remove()">✕</button>';
  if (dt) div.querySelector('[data-f="dataType"]').value = dt;
  document.getElementById('tagRows').appendChild(div);
}
addTagRow('Start_Btn','Bool','I0.0'); addTagRow('Stop_Btn','Bool','I0.1'); addTagRow('Motor_On','Bool','Q0.0');

async function addTags() {
  const tags = [...document.querySelectorAll('#tagRows .row')].map(r => ({
    name: r.querySelector('[data-f="name"]').value,
    dataType: r.querySelector('[data-f="dataType"]').value,
    address: r.querySelector('[data-f="address"]').value,
  })).filter(t => t.name);
  await cmd('add-tags', {table: val('tagTable'), tags});
}

// 打开工程:文件选择器 → 上传到本机 → 打开
document.getElementById('projFilePicker').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const resultEl = document.getElementById('result');
  resultEl.innerHTML = '<span class="warn">上传工程文件…</span>';
  try {
    const fd = new FormData();
    fd.append('file', f);
    const r = await fetch('/api/upload', {method:'POST', body: fd});
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || '上传失败');
    await cmd('open-project', {projectFile: d.path});
  } catch(err) {
    resultEl.innerHTML = '<span class="err">打开失败: ' + err + '</span>';
  } finally {
    e.target.value = '';
  }
});

async function refreshStatus() {
  try {
    const r = await fetch('/api/status'); const s = await r.json();
    if (s.outDir) OUT_DIR = s.outDir;
    const bar = document.getElementById('statusBar');
    bar.textContent = s.ready ? (s.attach ? 'Attach: ' + (s.project||'工程') : 'Headless') : '未连接';
    bar.className = 'status ' + (s.ready ? 'st-ok' : 'st-off');
  } catch(e) {}
}

async function pollLog() {
  try {
    const r = await fetch('/api/log'); const d = await r.json();
    const el = document.getElementById('log');
    if (d.lines && d.lines.length) el.innerHTML = d.lines.map(l => escapeHtml(l)).join('<br>');
    el.scrollTop = el.scrollHeight;
  } catch(e) {}
  setTimeout(pollLog, 2000);
}
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

refreshStatus();
setTimeout(pollLog, 500);
</script>
</body>
</html>
